# MARX — implantação de produção (um servidor).
#   cp .env.example .env        # preencha DOMAIN e SECRET_KEY
#   docker compose up -d --build
#   docker compose exec api python -m app.cli create-admin --email voce@dominio --name "Seu nome"
#
# O servidor guarda SOMENTE a lista de usuários (SQLite no volume "usuarios").
# Arquivos, consultas e resultados são processados no navegador de cada usuário.
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/marx-usuarios.db
      MARX_ENV: production
      COOKIE_SECURE: "true"
      PUBLIC_URL: https://${DOMAIN}
    volumes:
      - usuarios:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  usuarios:
  caddy_data:
  caddy_config:
