name: Deploy

# main    → produção   (GitHub Environment "production", pode exigir aprovação manual)
# develop → homologação (GitHub Environment "staging")
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente'
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    # só publica se o CI passou (testes obrigatórios antes de promover)
    # Opcional: só roda quando o caminho Cloudflare estiver configurado (variável CLOUDFLARE_PROJECT).
    # Sem ela, a publicação é feita pelo workflow "Publicar no GitHub Pages".
    if: vars.CLOUDFLARE_PROJECT != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production') && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 1) Banco: migrações versionadas, aditivas, aplicadas ANTES do front-end
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrações do banco
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Publicar Edge Functions
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      # 2) Front-end
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: ${{ (github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production') && 'production' || 'staging' }}
      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=${{ github.event.workflow_run.head_branch || (inputs.environment == 'production' && 'main' || 'develop') }} --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}

      # 3) Registro da versão (aparece no painel administrativo)
      - name: Registrar versão
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL=${{ (github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production') && 'production' || 'staging' }}
          curl -fsS -X POST "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/admin_register_release" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"p_version\":\"$VERSION\",\"p_commit\":\"${GITHUB_SHA:0:12}\",\"p_channel\":\"$CHANNEL\",\"p_notes\":null}"
