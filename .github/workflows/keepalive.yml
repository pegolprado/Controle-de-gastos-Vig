name: Manter banco ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Uma consulta pública por dia (só a tabela de marca, liberada para anon) evita a pausa.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o Supabase
        run: |
          set -euo pipefail
          set -a; . .github/public-config.env; set +a
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "Supabase não configurado em .github/public-config.env; nada a fazer."; exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
              -H "apikey: $VITE_SUPABASE_ANON_KEY" \
              "$VITE_SUPABASE_URL/rest/v1/app_settings?select=id&id=eq.1") || code=000
            if [ "$code" = 200 ]; then echo "Banco ativo: $(cat /tmp/out.json)"; exit 0; fi
            echo "Tentativa $i: HTTP $code"; sleep 20
          done
          echo "::error::O Supabase não respondeu. Se o projeto estiver pausado, reative em supabase.com/dashboard."
          exit 1
