name: Renda diária (proventos, piloto automático e avisos)

# 08:00 e 19:00 de Brasília. Sem o segredo SUPABASE_SERVICE_ROLE_KEY, só registra um aviso e sai.
on:
  schedule:
    - cron: '7 11 * * *'
    - cron: '7 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renda-diaria
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar a rotina
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          set -a; . .github/public-config.env; set +a
          mkdir -p /tmp/job && cp scripts/renda-job.mjs /tmp/job/
          cd /tmp/job && npm init -y >/dev/null && npm install --silent --no-audit --no-fund web-push@3.6.7
          node renda-job.mjs
