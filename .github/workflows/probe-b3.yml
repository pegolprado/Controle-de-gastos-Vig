name: Sonda B3 (temporário)
on:
  push:
    branches: [claude/finance-os-app-768to0]
    paths: [.github/workflows/probe-b3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          P=$(printf '%s' '{"cnpj":"0","identifierFund":"MXRF","typeFund":7}' | base64 -w0)
          curl -sS -m 30 -D - -o /tmp/b.json -H 'Origin: https://app.financemv.com.br' "https://sistemaswebb3-listados.b3.com.br/fundsProxy/fundsCall/GetListedSupplementFunds/$P" | grep -i -E 'HTTP/|access-control|content-type|cache'
          head -c 400 /tmp/b.json; echo
          echo "=== OPTIONS"; curl -sS -m 30 -X OPTIONS -D - -o /dev/null -H 'Origin: https://app.financemv.com.br' -H 'Access-Control-Request-Method: GET' "https://sistemaswebb3-listados.b3.com.br/fundsProxy/fundsCall/GetListedSupplementFunds/$P" | grep -i -E 'HTTP/|access-control'
