name: Sonda B3 (temporário)
on:
  push:
    branches: [claude/finance-os-app-768to0]
    paths: [.github/workflows/probe-b3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          docker run -d --name pg -e POSTGRES_PASSWORD=pg -p 5432:5432 postgres:16
          sleep 8
          docker exec pg bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-http >/dev/null'
          export PGPASSWORD=pg
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/00_supabase_stub.sql
          for f in supabase/migrations/*.sql; do $P -f "$f"; done
          $P -f supabase/tests/01_helpers.sql
          $P -At <<'SQL'
          do $$ declare u uuid; begin
            u := tests.create_user('probe@example.com');
            perform tests.login(u);
            raise notice 'XPML11: %', public.asset_sync('XPML11', 'fii');
            raise notice 'PETR4: %', public.asset_sync('PETR4', 'stock');
            raise notice 'TAEE11: %', public.asset_sync('TAEE11', 'stock');
            raise notice 'ITSA4: %', public.asset_sync('ITSA4', 'stock');
            raise notice 'XXXX3: %', public.asset_sync('XXXX3', 'stock');
            raise notice 'XPML11 de novo: %', public.asset_sync('XPML11', 'fii');
          end $$;
          select * from public.asset_quotes order by 1;
          select code, name, not_found from public.stock_companies order by 1;
          select code, substr(isin,7,5), kind, record_date, payment_date, rate from public.stock_distributions where payment_date >= current_date - 60 or payment_date is null order by code, payment_date desc nulls first limit 25;
          SQL
