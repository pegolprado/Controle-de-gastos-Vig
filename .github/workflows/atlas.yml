name: ATLAS

on:
  pull_request:
    paths: ['atlas/**', '.github/workflows/atlas.yml']
  push:
    branches: [main]
    paths: ['atlas/**', '.github/workflows/atlas.yml']

jobs:
  backend:
    name: Back-end (testes com PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: atlas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por fonts-dejavu-core
      - run: pip install -r requirements.txt xlwt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/atlas_test

  frontend:
    name: Front-end (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vitest run
      - run: npx vite build
