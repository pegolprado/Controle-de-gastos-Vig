name: MARX

on:
  pull_request:
    paths: ['atlas/**', '.github/workflows/atlas.yml']
  push:
    branches: [main]
    paths: ['atlas/**', '.github/workflows/atlas.yml']

jobs:
  marx:
    name: Tipos, lint, testes, build e ponta a ponta (Cloudflare local)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build
      - name: Arquivos dentro do limite do Cloudflare Pages (25 MiB)
        run: test -z "$(find dist -type f -size +25M)"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
